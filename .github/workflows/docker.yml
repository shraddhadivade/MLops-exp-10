
name: Docker ML Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t mlops-exp-10 .

      - name: Run Docker Container
        run: docker run -d --name ml-container -p 5000:5000 mlops-exp-10

      - name: Test API Health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs ml-container
          exit 1

      - name: Test ML Prediction
        run: |
          response=$(curl -fsS -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"study_hours":8,"attendance":90}')
          echo "$response"
          echo "$response" | grep -q '"result":"Pass"'

      - name: Stop Docker Container
        if: always()
        run: docker rm -f ml-container || true
