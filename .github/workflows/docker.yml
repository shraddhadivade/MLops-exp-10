
name: Docker ML Application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t mlops-exp-10 .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name mlops-container \
            -p 5000:5000 \
            mlops-exp-10

      - name: Test API Health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              echo "API Health Check Passed"
              exit 0
            fi
            echo "Waiting for API to start..."
            sleep 2
          done

          echo "API Health Check Failed"
          docker logs mlops-container
          exit 1

      - name: Test ML Prediction
        run: |
          response=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d '{"Study_Hours":6,"Attendance":85}' \
            http://localhost:5000/predict)

          echo "Prediction Response:"
          echo "$response"

          RESPONSE="$response" python3 -c '
          import json
          import os
          import sys

          data = json.loads(os.environ["RESPONSE"])

          assert data.get("status") == "success", "Prediction status failed"
          assert data.get("prediction") in ["Pass", "Fail"], "Invalid prediction"

          print("ML Prediction Test Passed")
          print("Predicted Result:", data["prediction"])
          '

      - name: Stop Docker Container
        if: always()
        run: |
          docker stop mlops-container || true
          docker rm mlops-container || true
